server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off valid=5s;
    set $membership_api membership:5190;
    set $work_api work-api:5180;
    set $automation_api automation-api:4310;
    client_max_body_size 1536m;
    location ~ ^/api/(auth|invitations|membership)(/|$) {
        proxy_pass http://$membership_api;
        proxy_set_header Host $http_host;
    }
    location = /api/platform/branding/access {
        proxy_pass http://$membership_api;
        proxy_set_header Host $http_host;
    }
    location /api/ {
        proxy_pass http://$work_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /automations-api/ {
        rewrite ^/automations-api/(.*)$ /$1 break;
        proxy_pass http://$automation_api;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-cache;
    }
}
