server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off valid=5s;
    set $membership_api membership:5190;
    set $work_api boards:5180;
    set $automation_api automations:4310;
    set $ai_api ai:4330;
    client_max_body_size 1536m;
    location ~ ^/api/(auth|membership)(/|$) {
        proxy_pass http://$membership_api;
        proxy_set_header Host $http_host;
    }
    location = /api/platform/branding/access {
        proxy_pass http://$membership_api;
        proxy_set_header Host $http_host;
    }
    location /api/ {
        proxy_pass http://$work_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /auth/callback {
        access_log off;
        proxy_pass http://$ai_api/oauth/callback$is_args$args;
        proxy_set_header Host $http_host;
    }
    location /ai-api/ {
        access_log off;
        rewrite ^/ai-api/(.*)$ /$1 break;
        proxy_pass http://$ai_api;
        proxy_set_header Host $http_host;
        proxy_read_timeout 120s;
    }
    location /automations-api/ {
        rewrite ^/automations-api/(.*)$ /$1 break;
        proxy_pass http://$automation_api;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-cache;
    }
}
