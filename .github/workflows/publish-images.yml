name: Publish container images

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      channel:
        description: Publication channel (stable requires main)
        type: choice
        required: true
        default: preview
        options: [preview, stable]

permissions:
  contents: read

jobs:
  changes:
    name: Select affected images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
      has_changes: ${{ steps.images.outputs.has_changes }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Check out repository and history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify image selection rules
        run: python3 -m unittest discover -s tests -p "test_image_*.py"
      - name: Build image matrix
        id: images
        run: python3 .github/scripts/image_matrix.py
      - name: Generate semantic image version
        if: steps.images.outputs.has_changes == 'true'
        id: version
        env:
          IMAGE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || (github.ref == 'refs/heads/main' && 'stable' || 'preview') }}
        run: python3 .github/scripts/image_version.py

  publish:
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.changes.outputs.version }},priority=900
            type=raw,value=${{ needs.changes.outputs.channel }}
            type=raw,value=latest,enable=${{ needs.changes.outputs.channel == 'stable' }}
            type=sha,format=long,prefix=${{ needs.changes.outputs.channel == 'preview' && 'prev-sha-' || 'sha-' }}
          labels: |
            org.opencontainers.image.version=${{ needs.changes.outputs.version }}
            org.opencontainers.image.title=domus ${{ matrix.component }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
